<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0f1e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="WorkSync" />
  <title>WorkSync</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      background: var(--bg-primary);
    }
    .splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      animation: fadeIn 0.6s ease;
    }
    .splash-logo {
      width: 72px;
      height: 72px;
      background: var(--accent-gradient);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      box-shadow: 0 0 40px rgba(99, 179, 237, 0.3);
    }
    .splash-title {
      font-family: 'Syne', sans-serif;
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.02em;
    }
    .splash-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(99, 179, 237, 0.2);
      border-top-color: var(--accent-blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div class="splash">
    <div class="splash-logo">⚡</div>
    <div class="splash-title">WorkSync</div>
    <div class="splash-spinner"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/app.js"></script>
  <script>
    (async () => {
      try {
        const session = await AppCore.getSession();
        if (!session) {
          window.location.replace('login.html');
          return;
        }
        const { data: profile, error } = await AppCore.supabase
          .from('users')
          .select('role')
          .eq('id', session.user.id)
          .single();

        if (error || !profile) {
          await AppCore.supabase.auth.signOut();
          window.location.replace('login.html');
          return;
        }
        if (profile.role === 'admin') {
          window.location.replace('admin.html');
        } else if (profile.role === 'worker') {
          window.location.replace('worker.html');
        } else {
          await AppCore.supabase.auth.signOut();
          window.location.replace('login.html');
        }
      } catch (e) {
        console.error('[index] routing error:', e);
        window.location.replace('login.html');
      }
    })();
  </script>
</body>
</html>
